name: JKXR

options:
  bundleIdPrefix: de.martek
  createIntermediateGroups: true
  deploymentTarget:
    # 26.4, nicht 2.0.
    #
    # WorldTracking.m benutzt ar_accessory_tracking_provider_* und
    # GCProductCategorySpatialController — beides gibt es erst ab visionOS 26.
    # Mit Ziel 2.0 warnte der Compiler vierzehnmal (-Wunguarded-availability-new),
    # und auf einem älteren System wäre es ein Absturz beim Start.
    #
    # Die vorgebauten ANGLE-Frameworks bleiben bei xros 2.0; ein niedrigeres
    # minos in einer Abhängigkeit ist unkritisch.
    visionOS: "26.4"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 9VSUPJ942Y
    PRODUCT_BUNDLE_IDENTIFIER: de.martek.jkxr
    GENERATE_INFOPLIST_FILE: "YES"

targets:
  JKXR:
    type: application
    platform: visionOS
    sources:
      - path: Sources
      # Die VR-Zusatzdateien werden MITGELIEFERT.
      #
      # Sie gehoeren zum Port, nicht zum gekauften Spiel: Waffenmodelle,
      # Shader, HUD-Teile. Wer die App aus TestFlight bekommt, hat keine
      # Bezugsquelle dafuer -- die drei Dateien lagen bisher nur im Repo, und
      # jeder Tester haette danach fragen muessen.
      #
      # Referenziert statt kopiert, damit es die 24 MB nur einmal im Baum gibt
      # und die Fassung im Installer und die in der App nicht auseinanderlaufen.
      # z_vr_assets_base.pk3 ist fuer beide Spiele dieselbe Datei (gleiche
      # Pruefsumme), deshalb nur einmal.
      - path: ../../JKXR-PCVR-Installer/JKA/base/z_vr_assets_base.pk3
        buildPhase: resources
      - path: ../../JKXR-PCVR-Installer/JKA/base/z_vr_assets_jka.pk3
        buildPhase: resources
      - path: ../../JKXR-PCVR-Installer/JKO/base/z_vr_assets_jko.pk3
        buildPhase: resources
    dependencies:
      # ANGLE, gebaut aus angle/out/xros (patch-angle-visionos.py) mit
      # Foveation-Unterstützung im Metal-Backend (patch-angle-foveation.py).
      # embed, weil die App sie zur Laufzeit lädt.
      - framework: Frameworks/libEGL.framework
        embed: true
        codeSign: true
      - framework: Frameworks/libGLESv2.framework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: JKXR
        INFOPLIST_KEY_CFBundleDisplayName: Jedi Knight XR

        # Das Programmsymbol.
        #
        # visionOS zeigt keine flache Grafik, sondern einen Stapel aus Schichten,
        # die sich beim Ansehen gegeneinander verschieben. Deshalb ein
        # .solidimagestack mit Rueckseite (Verlauf) und Vorderseite (Emblem,
        # Schriftzug und Saeberschein, mit Alpha) statt eines einzelnen Bildes.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

        # Ohne Zweckangabe verweigert visionOS den ARKit-Provider, und zwar
        # wortlos — die Anfrage erreicht den Nutzer gar nicht erst.
        INFOPLIST_KEY_NSWorldSensingUsageDescription: >-
          Kopf- und Controllerposition für das Spiel im Immersive Space.

        # Erzeugt UIApplicationSceneManifest mit UIApplicationSupportsMultipleScenes.
        # Ohne diesen Eintrag weiß visionOS nicht, dass die App neben dem Fenster
        # einen Immersive Space öffnen darf — openImmersiveSpace scheitert dann
        # kommentarlos, und im Headset passiert schlicht nichts.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"

        # Die Spieldateien (assets0.pk3 … assets3.pk3, rund 1,2 GB) lassen sich
        # nicht mitliefern; sie müssen über die Dateien-App hinein.
        #
        # Die beiden nötigen Schlüssel stehen in Info.plist, NICHT hier:
        # UIFileSharingEnabled ist kein von Xcode unterstütztes INFOPLIST_KEY_
        # und wird als solches kommentarlos verworfen. Xcode mischt die
        # generierten Schlüssel in die Datei ein.
        INFOPLIST_FILE: Info.plist

        # Xcode baut Debug-Ziele sonst zweiteilig: ein Ladestub namens JKXR und
        # daneben JKXR.debug.dylib mit dem eigentlichen Code (für SwiftUI-
        # Vorschauen). Das ist hier unerwünscht, weil Sys_LoadDll RTLD_DEFAULT
        # zurückgibt und dlsym dann über zwei Images suchen müsste — eine
        # Unbekannte, die sich für nichts einhandelt.
        ENABLE_DEBUG_DYLIB: "NO"

        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge/JKXR-Bridging-Header.h
        # Der zweite Pfad wegen JKXR_visionOS_Spiel.h: die Spieltabelle ist
        # die Schnittstelle zwischen Hülle und Engine und liegt deshalb im
        # Engine-Baum, nicht in Sources/Bridge.
        HEADER_SEARCH_PATHS: >-
          $(SRCROOT)/../../spikes/s4-angle/angle-include
          $(SRCROOT)/../../Projects/Android/jni/OpenJK/code/visionos
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

        # Die Engine. Erklärung zu jedem Teil in link-visionos.sh:
        #
        #   spiel-ja.o    Jedi Academy, spiel-jo.o Jedi Outcast — je ein
        #   spiel-jo.o    vollständiger Satz aus Client, Renderer, Spielcode,
        #                 XR-Schicht und Hilfsbibliotheken, zweistufig
        #                 teil-gelinkt. Jedes Objekt trägt nach außen genau ein
        #                 Symbol: seine Spieltabelle. Nur so lassen sich zwei
        #                 Engines in einem Programm halten, die beide Com_Printf,
        #                 GetRefAPI und vmMain mitbringen.
        #   -force_load   ein Alias braucht sein Ziel im Link, und referenziert
        #                 wird nur der Aliasname.
        #   -alias_list   Mach-O kennt keine Compiler-Aliase (793 Stück).
        #   -lc++         Xcode linkt eine Swift-App mit clang, nicht clang++,
        #                 und zieht die C++-Standardbibliothek daher nicht von
        #                 selbst hinzu. Die Engine ist C++.
        #
        # libpng, libjpeg, libzip, libminizip und sigc stehen hier NICHT mehr:
        # sie rufen die Engine zurück (etwa openjk_minizip_malloc) und stecken
        # deshalb in den Spielsätzen selbst.
        OTHER_LDFLAGS: >-
          -Wl,-force_load,$(SRCROOT)/../../build-visionos/gl4es/lib/libGL.a
          -Wl,-alias_list,$(SRCROOT)/../../build-visionos/gl4es-aliases.txt
          $(SRCROOT)/../../build-visionos/link/spiel-ja.o
          $(SRCROOT)/../../build-visionos/link/spiel-jo.o
          -lz
          -lc++
          -framework AudioToolbox
          -framework AVFoundation
          -framework GameController
